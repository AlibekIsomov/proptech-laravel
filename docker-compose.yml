# version: '3.8'  # obsolete — removed to suppress warnings

services:
  # PHP-FPM container — CI/CD yuklagan tayyor tayyor image'ni tortadi
  app:
    image: ${IMAGE_NAME:-ghcr.io/alibekisomov/proptech-laravel}:${IMAGE_TAG:-latest}
    container_name: proptech_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # DB_CONNECTION ni majburiy pgsql qilamiz (.env dagi default sqlite ni ezib o'tamiz)
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    volumes:
      # Production-da kodni bog'lamaymiz, faqat o'zgaruvchan papkalarni bog'laymiz:
      - storage_data:/var/www/html/storage
      - public_data:/var/www/html/public   # nginx bilan umumiy public/ papka
    depends_on:
      db:
        condition: service_healthy
    networks:
      - proptech-network

  # Nginx container — Web server
  web:
    image: nginx:alpine
    container_name: proptech_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80" # Host Nginx reverse proxy orqali ulanish uchun faqat localhost-ga bog'laymiz
    volumes:
      # Nginx assetlarni o'qishi uchun public papkasini ulash
      - public_data:/var/www/html/public:ro  # read-only: nginx faqat o'qiydi
      - ./docker/nginx.prod.conf:/etc/nginx/nginx.conf:ro # Production nginx config
    depends_on:
      - app
    networks:
      - proptech-network

  # Local PostgreSQL container
  db:
    image: postgres:15-alpine
    container_name: proptech_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-proptech}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - proptech-network

  # Queue Worker — Supabase sync va boshqa async joblar uchun
  queue:
    image: ${IMAGE_NAME:-ghcr.io/alibekisomov/proptech-laravel}:${IMAGE_TAG:-latest}
    container_name: proptech_queue
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "exec php artisan queue:work --sleep=3 --tries=3 --max-time=3600"]
    env_file:
      - .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - proptech-network

  # Prometheus — metrikalarni yig'ib saqlaydi
  prometheus:
    image: prom/prometheus:latest
    container_name: proptech_prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway" # node-exporter (host network) ni topish uchun
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090" # faqat localhost — tashqariga host-nginx orqali ochiladi
    networks:
      - proptech-network

  # Grafana — dashboard/vizualizatsiya
  grafana:
    image: grafana/grafana:latest
    container_name: proptech_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD .env da kerak}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000" # 3000-port serverda boshqa (Node.js) loyiha band qilgan — 3001 ishlatamiz
    depends_on:
      - prometheus
    networks:
      - proptech-network

  # node-exporter — VPS'ning o'zi: CPU/RAM/disk/tarmoq metrikalari
  node-exporter:
    image: prom/node-exporter:latest
    container_name: proptech_node_exporter
    restart: unless-stopped
    pid: host
    network_mode: host # host resurslarini o'lchash uchun shart; 9100-portni firewall bilan yoping
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  # cAdvisor — har bir Docker konteynerning CPU/xotira/tarmoq metrikalari alohida-alohida
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: proptech_cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "127.0.0.1:8081:8080" # faqat localhost
    networks:
      - proptech-network

  # postgres-exporter — DB metrikalari (connectionlar, sekin query'lar va h.k.)
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: proptech_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USERNAME}:${DB_PASSWORD}@db:5432/${DB_DATABASE}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - proptech-network

networks:
  proptech-network:
    driver: bridge

volumes:
  public_data:   # app va nginx o'rtasida umumiy public/ papka
  storage_data:
  db_data:
  prometheus_data:
  grafana_data:
