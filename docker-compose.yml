# version: '3.8'  # obsolete — removed to suppress warnings

services:
  # PHP-FPM container — CI/CD yuklagan tayyor tayyor image'ni tortadi
  app:
    image: ${IMAGE_NAME:-ghcr.io/alibekisomov/proptech-laravel}:${IMAGE_TAG:-latest}
    container_name: proptech_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # DB_CONNECTION ni majburiy pgsql qilamiz (.env dagi default sqlite ni ezib o'tamiz)
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-proptech}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      # Production-da kodni bog'lamaymiz, faqat o'zgaruvchan papkalarni bog'laymiz:
      - storage_data:/var/www/html/storage
      - public_data:/var/www/html/public   # nginx bilan umumiy public/ papka
    depends_on:
      db:
        condition: service_healthy
    networks:
      - proptech-network

  # Nginx container — Web server
  web:
    image: nginx:alpine
    container_name: proptech_web
    restart: unless-stopped
    ports:
      - "80:80" # Production uchun 8080 emas, to'g'ridan-to'g'ri 80-portni ochdik
    volumes:
      # Nginx assetlarni o'qishi uchun public papkasini ulash
      - public_data:/var/www/html/public:ro  # read-only: nginx faqat o'qiydi
      - ./docker/nginx.prod.conf:/etc/nginx/nginx.conf:ro # Production nginx config
    depends_on:
      - app
    networks:
      - proptech-network

  # Local PostgreSQL container
  db:
    image: postgres:15-alpine
    container_name: proptech_db
    restart: unless-stopped
    ports:
      - "5432:5432" # Tashqi portni ham production-ga mosladik
    environment:
      POSTGRES_DB: ${DB_DATABASE:-proptech}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-proptech}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - proptech-network

networks:
  proptech-network:
    driver: bridge

volumes:
  public_data:   # app va nginx o'rtasida umumiy public/ papka
  storage_data:
  db_data:
