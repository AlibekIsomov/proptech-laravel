services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proptech_app
    ports:
      - "8080:8080"
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .env:/var/www/html/.env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
