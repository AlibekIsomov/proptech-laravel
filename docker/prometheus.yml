global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter' # VPS server metrikalari
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: 'postgres-exporter' # DB metrikalari
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'cadvisor' # har bir konteyner uchun alohida CPU/xotira
    static_configs:
      - targets: ['cadvisor:8080']
